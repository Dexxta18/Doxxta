# Runs the Android app in an emulator (tests/mobile/android-smoke.mjs) and the iPhone app in a
# simulator (tests/mobile/ios-smoke.sh), and keeps their screenshots as downloads on the run's page.
# Run it from the Actions tab ("Run workflow").
name: Phone app check

on:
  workflow_dispatch:
    inputs:
      phones:
        description: Which apps to check
        type: choice
        options: [both, android, iphone]
        default: both
      screenshot_notes:
        description: Also put small copies of the screenshots in the run's notes (data URLs)
        type: boolean
        default: false

jobs:
  android:
    if: inputs.phones != 'iphone'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: node scripts/make-fixtures.mjs
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          SCREENSHOT_NOTES: ${{ inputs.screenshot_notes && '1' || '' }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: node tests/mobile/android-smoke.mjs android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-screenshots
          path: test-output/mobile

  ios:
    if: inputs.phones != 'android'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/make-fixtures.mjs
      - name: Run the iPhone app in a simulator
        env:
          SCREENSHOT_NOTES: ${{ inputs.screenshot_notes && '1' || '' }}
        run: bash tests/mobile/ios-smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: iphone-screenshots
          path: test-output/mobile
