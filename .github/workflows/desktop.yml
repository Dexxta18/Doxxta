# Builds the desktop installers on each operating system and the phone apps (Android APK, iOS
# app to sign), and publishes them on the repository's Releases page: run it from the Actions tab
# ("Run workflow"), which names the release after the version in package.json, or push a tag
# such as v0.4.0. A manual run with "Publish a release" unticked only leaves the files as
# downloads on the run's page.
name: Installers

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release named after the version in package.json
        type: boolean
        default: true
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac --arm64 --x64
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/desktop.mjs dist ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: doxxta-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      # The app's signing key (README → Phone apps); without it the APK is signed with a throwaway key.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/doxxta.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/doxxta.jks" >> "$GITHUB_ENV"
      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Doxxta-$(node -p "require('./package.json').version").apk"
      - uses: actions/upload-artifact@v7
        with:
          name: doxxta-android
          path: out/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      # Unsigned: installed with a free Apple ID (Sideloadly, AltStore) or, signed, through TestFlight.
      - name: Build the app
        run: |
          version=$(node -p "require('./package.json').version")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$version" build
          mkdir -p Payload out
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "out/Doxxta-$version-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: doxxta-ios
          path: out/*.ipa
          if-no-files-found: error

  release:
    needs: [build, android, ios]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Publish the installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A tag push names the release; a manual run uses the version in package.json and creates its tag.
          tag="$GITHUB_REF_NAME"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" installers/* --clobber
          else
            gh release create "$tag" installers/* \
              --target "$GITHUB_SHA" \
              --title "Doxxta $tag" \
              --notes "Windows: Doxxta-Setup-*.exe · macOS: the .dmg for your Mac (arm64 = Apple Silicon, x64 = Intel) · Linux: the .AppImage · Android: the .apk · iPhone: the -unsigned.ipa, installed with your Apple ID (see the README)"
          fi
