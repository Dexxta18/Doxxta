# Builds the desktop installers on each operating system and publishes them on the
# repository's Releases page: run it from the Actions tab ("Run workflow"), which names the
# release after the version in package.json, or push a tag such as v0.2.0. A manual run
# with "Publish a release" unticked only leaves the installers as downloads on the run's page.
name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release named after the version in package.json
        type: boolean
        default: true
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac --arm64 --x64
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/desktop.mjs dist ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: doxxta-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Publish the installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A tag push names the release; a manual run uses the version in package.json and creates its tag.
          tag="$GITHUB_REF_NAME"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" installers/* --clobber
          else
            gh release create "$tag" installers/* \
              --target "$GITHUB_SHA" \
              --title "Doxxta $tag" \
              --notes "Windows: Doxxta-Setup-*.exe · macOS: the .dmg for your Mac (arm64 = Apple Silicon, x64 = Intel) · Linux: the .AppImage"
          fi
